services:
  unifi-db:
    image: docker.io/mongo:4.4
    container_name: unifi-db
    environment:
      - MONGO_USER=${MONGO_USER:-unifi}
      - MONGO_PASS=${MONGO_PASS:?set MONGO_PASS}
      - MONGO_DBNAME=${MONGO_DBNAME:-unifi}
    volumes:
      - unifi-db-data:/data/db
    # Generates the init script at first start so no bind-mounted files are needed.
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /docker-entrypoint-initdb.d/init-mongo.sh <<'EOS'
        mongo --quiet <<EOJS
        db.getSiblingDB("$$MONGO_DBNAME").createUser({user: "$$MONGO_USER", pwd: "$$MONGO_PASS", roles: [{role: "dbOwner", db: "$$MONGO_DBNAME"}]});
        db.getSiblingDB("$${MONGO_DBNAME}_stat").createUser({user: "$$MONGO_USER", pwd: "$$MONGO_PASS", roles: [{role: "dbOwner", db: "$${MONGO_DBNAME}_stat"}]});
        EOJS
        EOS
        exec docker-entrypoint.sh mongod
    restart: unless-stopped

  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:${UNIFI_TAG:-latest}
    container_name: unifi-network-application
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - MONGO_USER=${MONGO_USER:-unifi}
      - MONGO_PASS=${MONGO_PASS:?set MONGO_PASS}
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=${MONGO_DBNAME:-unifi}
      - MEM_LIMIT=${MEM_LIMIT:-1024}
      - MEM_STARTUP=${MEM_STARTUP:-1024}
      - MONGO_TLS=${MONGO_TLS:-}
      - MONGO_AUTHSOURCE=${MONGO_AUTHSOURCE:-}
    volumes:
      - unifi-config:/config
    ports:
      - 8443:8443
      - 3478:3478/udp
      - 10001:10001/udp
      - 8080:8080
      - 1900:1900/udp
      - 8843:8843
      - 8880:8880
      - 6789:6789
      - 5514:5514/udp
    restart: unless-stopped
    depends_on:
      - unifi-db

volumes:
  unifi-db-data:
  unifi-config:
